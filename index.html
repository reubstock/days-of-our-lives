<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CARPE DIEM</title>
<style>
  :root {
    --bg: #ffffff;
    --ink: #000000;
    --lived: #000000;       /* spent — heavy */
    --remaining: #c9a227;   /* gold — yet to come */
    --rule: #000000;
    --gap: 6px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Times New Roman", Times, serif;
    -webkit-font-smoothing: antialiased;
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
  }
  body {
    height: 100dvh;
  }
  .page {
    height: 100dvh;
    max-width: 1180px;
    margin: 0 auto;
    padding: 10px 14px env(safe-area-inset-bottom) 14px;
    display: flex;
    flex-direction: column;
    gap: var(--gap);
  }

  /* Top row: prompt (1/3) + meta (2/3) on desktop */
  .top-row {
    flex: 0 0 auto;
    display: flex;
    align-items: stretch;
    gap: 14px;
    flex-wrap: wrap;
  }

  /* Prompt box */
  .prompt {
    border: 3px double var(--rule);
    padding: 0;
    flex: 0 1 33%;
    min-width: 240px;
    align-self: flex-start;
    background: var(--bg);
  }
  .prompt-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    background: var(--ink);
    color: var(--bg);
    padding: 5px 10px;
  }
  .prompt-label {
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    font-weight: 700;
  }
  .counter {
    font-size: 10px;
    letter-spacing: 0.1em;
    font-variant-numeric: tabular-nums;
    opacity: 0.7;
  }
  .counter.warn { opacity: 1; font-weight: 700; }
  .prompt-row {
    display: flex;
    align-items: stretch;
    gap: 0;
    padding: 8px 10px;
    border-top: 1px solid var(--rule);
  }
  .prompt textarea {
    flex: 1;
    border: none;
    outline: none;
    resize: none;
    font-family: inherit;
    font-size: 17px;  /* >=16 prevents iOS zoom */
    line-height: 1.3;
    background: transparent;
    color: var(--ink);
    height: 24px;     /* ~1 line at load */
    max-height: 84px; /* ~3-4 lines max */
    padding: 0 10px 0 0;
    overflow-y: auto;
  }
  .prompt textarea::placeholder {
    color: #bdbdbd;
    font-style: italic;
  }
  .send-btn {
    font-family: inherit;
    font-size: 10px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    font-weight: 700;
    padding: 0 12px;
    background: var(--ink);
    color: var(--bg);
    border: none;
    cursor: pointer;
    text-decoration: none;
    flex: 0 0 auto;
    line-height: 1;
    display: inline-flex;
    align-items: center;
    align-self: stretch;
    margin: -8px -10px -8px 0;
  }
  .send-btn[aria-disabled="true"] {
    background: #e6e6e6;
    color: #999;
    cursor: not-allowed;
    pointer-events: none;
  }

  /* Title row */
  .title-row {
    flex: 0 0 auto;
    text-align: center;
    padding: 2px 0 0;
  }
  h1 {
    font-size: clamp(28px, 8vw, 44px);
    letter-spacing: 0.24em;
    margin: 0;
    font-weight: 700;
    line-height: 1;
  }
  .h1-rule {
    height: 2px;
    background: var(--ink);
    margin: 6px 0 0;
  }

  /* Controls + readout — sits in the right 2/3 of the top row on desktop */
  .meta {
    flex: 1 1 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
    min-width: 0;
  }
  .controls {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .field { display: flex; align-items: center; gap: 5px; }
  .field label {
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    opacity: 0.6;
  }
  .field input[type="number"],
  .field select {
    font-family: inherit;
    font-size: 14px;
    padding: 3px 6px;
    border: 1px solid var(--rule);
    background: var(--bg);
    color: var(--ink);
  }
  .field input[type="number"] { width: 58px; }
  .field select { width: 92px; }

  .age-col { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; }
  .attribution {
    font-size: 9px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    opacity: 0.55;
    margin-left: 36px; /* roughly under the input, past the "Age" label */
  }
  .attribution a { color: inherit; text-decoration: underline; }
  .attribution a:hover { color: var(--ink); opacity: 1; }

  .readout {
    font-size: 11px;
    letter-spacing: 0.04em;
    opacity: 0.85;
    text-align: right;
    flex: 1 1 auto;
    min-width: 0;
  }
  .readout .num { font-weight: 700; }
  .legend {
    display: inline-flex;
    gap: 10px;
    align-items: center;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    opacity: 0.7;
  }
  .legend i {
    display: inline-block;
    width: 9px;
    height: 9px;
    margin-right: 4px;
    vertical-align: -1px;
  }
  .swatch-lived { background: var(--lived); }
  .swatch-left { background: var(--remaining); }

  /* Stats strip — three counts of things remaining */
  .stats {
    flex: 0 0 auto;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    border-top: 1px solid var(--rule);
    border-bottom: 1px solid var(--rule);
    padding: 6px 0;
  }
  .stat { text-align: center; min-width: 0; }
  .stat-num {
    font-size: clamp(20px, 4.4vw, 34px);
    font-weight: 700;
    color: var(--remaining);
    font-variant-numeric: tabular-nums;
    line-height: 1.05;
    letter-spacing: 0.01em;
  }
  #fartsNum  { color: #d62828; }  /* red   */
  #sexNum    { color: #2e7d32; }  /* green */
  #dreamsNum { color: #1e40af; }  /* blue  */
  .stat-label {
    font-size: 9px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    opacity: 0.7;
    margin-top: 3px;
  }
  .stat-sub {
    font-size: 8px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    opacity: 0.4;
    margin-top: 1px;
  }

  /* Grid — fills remaining space in BOTH dimensions (rectangles, not squares) */
  .grid-wrap {
    flex: 1 1 auto;
    min-height: 0;
    overflow: hidden;
    border-top: 1px solid var(--rule);
    padding-top: 6px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(52, 1fr);
    width: 100%;
    height: 100%;
    gap: 1px;
  }
  .cell { background: var(--bg); min-width: 0; min-height: 0; }
  .cell.lived { background: var(--lived); }
  .cell.left { background: var(--remaining); }

  /* Very small phones */
  @media (max-height: 640px) {
    :root { --gap: 4px; }
    .page { padding: 6px 10px; }
    .prompt { padding: 6px 8px; }
    h1 { font-size: clamp(18px, 6vw, 28px); }
    .grid-wrap { padding-top: 4px; }
  }
  @media (min-width: 700px) {
    .prompt { padding: 12px 14px; }
    .prompt-label, .counter { font-size: 11px; }
    .prompt textarea { font-size: 18px; height: 24px; }
    .field input[type="number"], .field select { font-size: 16px; padding: 5px 8px; }
    .readout { font-size: 12px; }
  }
</style>
</head>
<body>
<main class="page">

  <div class="title-row">
    <h1>CARPE DIEM</h1>
  </div>

  <div class="top-row">
    <section class="prompt">
      <div class="prompt-header">
        <div class="prompt-label">What will you do today?</div>
        <div class="counter" id="counter">0 / 180</div>
      </div>
      <div class="prompt-row">
        <textarea id="today" rows="1" maxlength="180" placeholder="Seize it…" spellcheck="false"></textarea>
        <a id="sendBtn" class="send-btn" aria-disabled="true" href="#">Send</a>
      </div>
    </section>

    <section class="meta">
      <div class="controls">
        <div class="age-col">
          <div class="field">
            <label for="age">Age</label>
            <input id="age" type="number" min="0" max="119" step="1" value="30">
          </div>
          <div class="attribution">
            Life Expectancy <a href="https://www.health.state.ny.us/health_care/medicaid/publications/docs/adm/06adm-5att8.pdf" target="_blank" rel="noopener noreferrer">via</a>
          </div>
        </div>
        <div class="field">
          <label for="sex">Sex</label>
          <select id="sex">
            <option value="male">Male</option>
            <option value="female" selected>Female</option>
          </select>
        </div>
      </div>
      <div class="readout" id="readout"></div>
    </section>
  </div>

  <section class="stats">
    <div class="stat">
      <div class="stat-num" id="fartsNum">—</div>
      <div class="stat-label">Farts Left</div>
      <div class="stat-sub">10 / day</div>
    </div>
    <div class="stat">
      <div class="stat-num" id="sexNum">—</div>
      <div class="stat-label">Sex Left</div>
      <div class="stat-sub" id="sexSub">avg by age</div>
    </div>
    <div class="stat">
      <div class="stat-num" id="dreamsNum">—</div>
      <div class="stat-label">Dreams Left</div>
      <div class="stat-sub">5 / night</div>
    </div>
  </section>

  <section class="grid-wrap" id="gridWrap">
    <div class="grid" id="grid" aria-label="Weeks of life"></div>
  </section>

</main>

<script>
  // NY State Medicaid 06 ADM-5 Attachment VIII — Life Expectancy Table
  const LE_MALE = [
    74.14,73.70,72.74,71.77,70.79,69.81,68.82,67.83,66.84,65.85,
    64.86,63.87,62.88,61.89,60.91,59.93,58.97,58.02,57.07,56.14,
    55.20,54.27,53.35,52.42,51.50,50.57,49.64,48.71,47.77,46.84,
    45.90,44.96,44.03,43.09,42.16,41.23,40.30,39.38,38.46,37.55,
    36.64,35.73,34.83,33.94,33.05,32.16,31.29,30.42,29.56,28.70,
    27.85,27.00,26.16,25.32,24.50,23.68,22.86,22.06,21.27,20.49,
    19.72,18.96,18.21,17.48,16.76,16.05,15.36,14.68,14.02,13.38,
    12.75,12.13,11.53,10.95,10.38, 9.83, 9.29, 8.77, 8.27, 7.78,
     7.31, 6.85, 6.42, 6.00, 5.61, 5.24, 4.89, 4.56, 4.25, 3.97,
     3.70, 3.45, 3.22, 3.01, 2.82, 2.64, 2.49, 2.35, 2.22, 2.11,
     2.00, 1.89, 1.79, 1.69, 1.59, 1.50, 1.41, 1.33, 1.25, 1.17,
     1.10, 1.03, 0.96, 0.89, 0.83, 0.77, 0.71, 0.66, 0.61, 0.56
  ];
  const LE_FEMALE = [
    79.45,78.94,77.97,77.00,76.01,75.03,74.04,73.05,72.06,71.07,
    70.08,69.09,68.09,67.10,66.11,65.13,64.15,63.17,62.20,61.22,
    60.25,59.28,58.30,57.33,56.36,55.39,54.41,53.44,52.47,51.50,
    50.53,49.56,48.60,47.63,46.67,45.71,44.76,43.80,42.86,41.91,
    40.97,40.03,39.09,38.16,37.23,36.31,35.39,34.47,33.56,32.65,
    31.75,30.85,29.95,29.07,28.18,27.31,26.44,25.58,24.73,23.89,
    23.06,22.24,21.43,20.63,19.84,19.06,18.30,17.54,16.80,16.07,
    15.35,14.65,13.96,13.28,12.62,11.97,11.33,10.71,10.11, 9.52,
     8.95, 8.40, 7.87, 7.36, 6.88, 6.42, 5.98, 5.56, 5.17, 4.81,
     4.47, 4.15, 3.86, 3.59, 3.35, 3.13, 2.93, 2.75, 2.58, 2.43,
     2.29, 2.15, 2.02, 1.89, 1.77, 1.66, 1.55, 1.44, 1.34, 1.25,
     1.16, 1.07, 0.99, 0.91, 0.84, 0.77, 0.71, 0.66, 0.61, 0.56
  ];

  const COLS = 52;

  const ageEl = document.getElementById('age');
  const sexEl = document.getElementById('sex');
  const gridEl = document.getElementById('grid');
  const readoutEl = document.getElementById('readout');
  const todayEl = document.getElementById('today');
  const counterEl = document.getElementById('counter');
  const sendBtn = document.getElementById('sendBtn');
  const fartsNumEl = document.getElementById('fartsNum');
  const dreamsNumEl = document.getElementById('dreamsNum');
  const sexNumEl = document.getElementById('sexNum');
  const sexSubEl = document.getElementById('sexSub');

  // Per-year sex frequency by age bracket (Kinsey-ish public averages):
  //   18–29: ~2.5/wk = 130/yr
  //   30–49: ~1.5/wk =  78/yr
  //   50+  : ~3/mo   =  36/yr
  //   <18  : 0 (not counted)
  function sexFreqPerYear(a) {
    if (a < 18) return 0;
    if (a < 30) return 2.5 * 52;
    if (a < 50) return 1.5 * 52;
    return 3 * 12;
  }
  function sexLeft(currentAge, remainingYears) {
    let total = 0;
    let a = currentAge;
    let end = currentAge + remainingYears;
    while (a < end) {
      const chunk = Math.min(1, end - a);
      total += sexFreqPerYear(Math.floor(a)) * chunk;
      a += chunk;
    }
    return Math.round(total);
  }
  const MAX_CHARS = 180;
  const RECIPIENT = 'reubstock@gmail.com';

  function clampAge(v) {
    v = Math.floor(Number(v));
    if (!Number.isFinite(v)) return 0;
    return Math.max(0, Math.min(119, v));
  }

  function render() {
    const age = clampAge(ageEl.value);
    const table = sexEl.value === 'male' ? LE_MALE : LE_FEMALE;
    const remainingYears = table[age];
    const totalYears = age + remainingYears;
    const totalRows = Math.ceil(totalYears);
    const totalWeeks = totalRows * COLS;
    const weeksLived = Math.round(age * COLS);
    const weeksLeft = Math.max(0, Math.round(totalYears * COLS) - weeksLived);

    readoutEl.innerHTML =
      `<span class="legend"><span><i class="swatch-lived"></i>lived</span><span><i class="swatch-left"></i>left</span></span> ` +
      `&nbsp; <span class="num">${weeksLeft.toLocaleString()}</span> weeks (<span class="num">${remainingYears.toFixed(1)}</span> yrs) to go`;

    // Stats: counts based on time remaining
    const daysLeft = remainingYears * 365.25;
    fartsNumEl.textContent = Math.round(daysLeft * 10).toLocaleString();
    dreamsNumEl.textContent = Math.round(daysLeft * 5).toLocaleString();
    sexNumEl.textContent = sexLeft(age, remainingYears).toLocaleString();
    sexSubEl.textContent =
      age < 18 ? 'starts at 18' :
      age < 30 ? '~2.5 / week' :
      age < 50 ? '~1.5 / week' :
                 '~3 / month';

    const filledWeeks = weeksLived + weeksLeft;
    const cells = new Array(totalWeeks);
    for (let i = 0; i < totalWeeks; i++) {
      let cls = 'cell';
      if (i < weeksLived) cls += ' lived';
      else if (i < filledWeeks) cls += ' left';
      cells[i] = `<div class="${cls}"></div>`;
    }
    gridEl.style.gridTemplateRows = `repeat(${totalRows}, 1fr)`;
    gridEl.innerHTML = cells.join('');
  }

  function updatePrompt() {
    const text = todayEl.value.slice(0, MAX_CHARS);
    if (text.length !== todayEl.value.length) todayEl.value = text;
    const len = text.length;
    counterEl.textContent = `${len} / ${MAX_CHARS}`;
    counterEl.classList.toggle('warn', len >= MAX_CHARS - 20);

    const trimmed = text.trim();
    if (trimmed.length === 0) {
      sendBtn.setAttribute('aria-disabled', 'true');
      sendBtn.removeAttribute('href');
      return;
    }
    sendBtn.setAttribute('aria-disabled', 'false');
    const today = new Date().toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' });
    sendBtn.href = `mailto:${RECIPIENT}?subject=${encodeURIComponent('Carpe Diem — ' + today)}&body=${encodeURIComponent(trimmed)}`;
  }

  ageEl.addEventListener('input', render);
  sexEl.addEventListener('change', render);
  todayEl.addEventListener('input', updatePrompt);

  render();
  updatePrompt();
</script>
</body>
</html>
