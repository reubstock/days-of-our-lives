<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CARPE DIEM</title>
<style>
  :root {
    --bg: #ffffff;
    --ink: #000000;
    --lived: #cfcfcf;
    --rule: #000000;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Times New Roman", Times, serif;
    -webkit-font-smoothing: antialiased;
  }
  .page {
    max-width: 960px;
    margin: 0 auto;
    padding: 28px 24px 80px;
  }

  /* Prompt box at top */
  .prompt {
    border: 1px solid var(--rule);
    padding: 18px 20px 16px;
    margin-bottom: 28px;
  }
  .prompt-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 8px;
    gap: 12px;
  }
  .prompt-label {
    font-size: 13px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    opacity: 0.7;
  }
  .counter {
    font-size: 12px;
    letter-spacing: 0.1em;
    font-variant-numeric: tabular-nums;
    opacity: 0.55;
  }
  .counter.warn { opacity: 1; color: #000; font-weight: 700; }
  .prompt textarea {
    width: 100%;
    border: none;
    outline: none;
    resize: none;
    font-family: inherit;
    font-size: 28px;
    line-height: 1.25;
    background: transparent;
    color: var(--ink);
    min-height: 1.4em;
    padding: 0;
  }
  .prompt textarea::placeholder {
    color: #bdbdbd;
    font-style: italic;
  }
  .prompt-footer {
    display: flex;
    justify-content: flex-end;
    margin-top: 12px;
  }
  .send-btn {
    font-family: inherit;
    font-size: 12px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    padding: 8px 18px;
    background: var(--ink);
    color: var(--bg);
    border: 1px solid var(--ink);
    cursor: pointer;
    text-decoration: none;
    display: inline-block;
  }
  .send-btn:hover { background: var(--bg); color: var(--ink); }
  .send-btn[aria-disabled="true"] {
    background: var(--bg);
    color: #bdbdbd;
    border-color: #bdbdbd;
    cursor: not-allowed;
    pointer-events: none;
  }

  /* Title */
  h1 {
    font-size: 56px;
    letter-spacing: 0.22em;
    text-align: center;
    margin: 28px 0 4px;
    font-weight: 700;
  }
  .tagline {
    text-align: center;
    font-style: italic;
    opacity: 0.65;
    margin-bottom: 28px;
    font-size: 15px;
  }

  /* Controls */
  .controls {
    display: flex;
    gap: 24px;
    align-items: flex-end;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 24px;
  }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label {
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    opacity: 0.6;
  }
  .field input[type="number"],
  .field select {
    font-family: inherit;
    font-size: 22px;
    padding: 6px 10px;
    border: 1px solid var(--rule);
    background: var(--bg);
    color: var(--ink);
    width: 110px;
  }
  .field select { width: 140px; }

  /* Readout */
  .readout {
    text-align: center;
    margin: 8px 0 22px;
    font-size: 15px;
    min-height: 1.4em;
  }
  .readout .num { font-weight: 700; }
  .legend {
    display: inline-flex;
    gap: 18px;
    align-items: center;
    margin-top: 6px;
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    opacity: 0.75;
  }
  .legend i {
    display: inline-block;
    width: 14px;
    height: 14px;
    margin-right: 6px;
    vertical-align: -2px;
  }
  .swatch-lived { background: var(--lived); }
  .swatch-left { background: var(--ink); }

  /* Grid */
  .grid-wrap {
    border-top: 1px solid var(--rule);
    padding-top: 22px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(52, 1fr);
    gap: 2px;
    width: 100%;
  }
  .cell {
    width: 100%;
    aspect-ratio: 1 / 1;
    background: var(--bg);
  }
  .cell.lived { background: var(--lived); }
  .cell.left { background: var(--ink); }

  /* Axis caption */
  .axis {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    opacity: 0.55;
    margin-top: 10px;
  }

  @media (max-width: 640px) {
    h1 { font-size: 38px; letter-spacing: 0.18em; }
    .prompt textarea { font-size: 22px; }
    .grid { gap: 1px; }
  }
</style>
</head>
<body>
<main class="page">

  <section class="prompt">
    <div class="prompt-header">
      <div class="prompt-label">What will you do today?</div>
      <div class="counter" id="counter">0 / 180</div>
    </div>
    <textarea id="today" rows="1" maxlength="180" placeholder="Seize it…" spellcheck="false"></textarea>
    <div class="prompt-footer">
      <a id="sendBtn" class="send-btn" aria-disabled="true" href="#">Send</a>
    </div>
  </section>

  <h1>CARPE DIEM</h1>
  <div class="tagline">one rectangle = one week</div>

  <section class="controls">
    <div class="field">
      <label for="age">Age</label>
      <input id="age" type="number" min="0" max="119" step="1" value="30">
    </div>
    <div class="field">
      <label for="sex">Sex</label>
      <select id="sex">
        <option value="male">Male</option>
        <option value="female" selected>Female</option>
      </select>
    </div>
  </section>

  <div class="readout" id="readout"></div>
  <div style="text-align:center;">
    <span class="legend">
      <span><i class="swatch-lived"></i>lived</span>
      <span><i class="swatch-left"></i>remaining</span>
    </span>
  </div>

  <section class="grid-wrap">
    <div class="grid" id="grid" aria-label="Weeks of life"></div>
    <div class="axis">
      <span>← birth</span>
      <span>each row = 1 year (52 weeks)</span>
      <span>death →</span>
    </div>
  </section>

</main>

<script>
  // NY State Medicaid 06 ADM-5 Attachment VIII — Life Expectancy Table
  // index = age, value = remaining life expectancy in years
  const LE_MALE = [
    74.14,73.70,72.74,71.77,70.79,69.81,68.82,67.83,66.84,65.85,
    64.86,63.87,62.88,61.89,60.91,59.93,58.97,58.02,57.07,56.14,
    55.20,54.27,53.35,52.42,51.50,50.57,49.64,48.71,47.77,46.84,
    45.90,44.96,44.03,43.09,42.16,41.23,40.30,39.38,38.46,37.55,
    36.64,35.73,34.83,33.94,33.05,32.16,31.29,30.42,29.56,28.70,
    27.85,27.00,26.16,25.32,24.50,23.68,22.86,22.06,21.27,20.49,
    19.72,18.96,18.21,17.48,16.76,16.05,15.36,14.68,14.02,13.38,
    12.75,12.13,11.53,10.95,10.38, 9.83, 9.29, 8.77, 8.27, 7.78,
     7.31, 6.85, 6.42, 6.00, 5.61, 5.24, 4.89, 4.56, 4.25, 3.97,
     3.70, 3.45, 3.22, 3.01, 2.82, 2.64, 2.49, 2.35, 2.22, 2.11,
     2.00, 1.89, 1.79, 1.69, 1.59, 1.50, 1.41, 1.33, 1.25, 1.17,
     1.10, 1.03, 0.96, 0.89, 0.83, 0.77, 0.71, 0.66, 0.61, 0.56
  ];
  const LE_FEMALE = [
    79.45,78.94,77.97,77.00,76.01,75.03,74.04,73.05,72.06,71.07,
    70.08,69.09,68.09,67.10,66.11,65.13,64.15,63.17,62.20,61.22,
    60.25,59.28,58.30,57.33,56.36,55.39,54.41,53.44,52.47,51.50,
    50.53,49.56,48.60,47.63,46.67,45.71,44.76,43.80,42.86,41.91,
    40.97,40.03,39.09,38.16,37.23,36.31,35.39,34.47,33.56,32.65,
    31.75,30.85,29.95,29.07,28.18,27.31,26.44,25.58,24.73,23.89,
    23.06,22.24,21.43,20.63,19.84,19.06,18.30,17.54,16.80,16.07,
    15.35,14.65,13.96,13.28,12.62,11.97,11.33,10.71,10.11, 9.52,
     8.95, 8.40, 7.87, 7.36, 6.88, 6.42, 5.98, 5.56, 5.17, 4.81,
     4.47, 4.15, 3.86, 3.59, 3.35, 3.13, 2.93, 2.75, 2.58, 2.43,
     2.29, 2.15, 2.02, 1.89, 1.77, 1.66, 1.55, 1.44, 1.34, 1.25,
     1.16, 1.07, 0.99, 0.91, 0.84, 0.77, 0.71, 0.66, 0.61, 0.56
  ];

  const WEEKS_PER_YEAR = 52; // visual row = 52 cells, one per week-of-year

  const ageEl = document.getElementById('age');
  const sexEl = document.getElementById('sex');
  const gridEl = document.getElementById('grid');
  const readoutEl = document.getElementById('readout');
  const todayEl = document.getElementById('today');
  const counterEl = document.getElementById('counter');
  const sendBtn = document.getElementById('sendBtn');
  const MAX_CHARS = 180;
  const RECIPIENT = 'reubstock@gmail.com';

  function clampAge(v) {
    v = Math.floor(Number(v));
    if (!Number.isFinite(v)) return 0;
    return Math.max(0, Math.min(119, v));
  }

  function render() {
    const age = clampAge(ageEl.value);
    const table = sexEl.value === 'male' ? LE_MALE : LE_FEMALE;
    const remainingYears = table[age];
    const totalYears = age + remainingYears;
    const totalRows = Math.ceil(totalYears); // each row = one full year
    const totalWeeks = totalRows * WEEKS_PER_YEAR;
    const weeksLived = Math.round(age * WEEKS_PER_YEAR);
    const weeksLeft = Math.max(0, Math.round(totalYears * WEEKS_PER_YEAR) - weeksLived);

    // Readout
    readoutEl.innerHTML =
      `Projected lifespan <span class="num">${totalYears.toFixed(2)}</span> years &nbsp;·&nbsp; ` +
      `<span class="num">${weeksLived.toLocaleString()}</span> weeks lived &nbsp;·&nbsp; ` +
      `<span class="num">${weeksLeft.toLocaleString()}</span> weeks remaining`;

    // Grid
    const filledWeeks = weeksLived + weeksLeft;
    const cells = new Array(totalWeeks);
    for (let i = 0; i < totalWeeks; i++) {
      let cls = 'cell';
      if (i < weeksLived) cls += ' lived';
      else if (i < filledWeeks) cls += ' left';
      cells[i] = `<div class="${cls}"></div>`;
    }
    gridEl.innerHTML = cells.join('');
  }

  // Auto-grow the prompt textarea
  function autogrow() {
    todayEl.style.height = 'auto';
    todayEl.style.height = todayEl.scrollHeight + 'px';
  }

  function updatePrompt() {
    // maxlength handles the hard cap; this keeps the UI in sync
    const text = todayEl.value.slice(0, MAX_CHARS);
    if (text.length !== todayEl.value.length) todayEl.value = text;

    const len = text.length;
    counterEl.textContent = `${len} / ${MAX_CHARS}`;
    counterEl.classList.toggle('warn', len >= MAX_CHARS - 20);

    const trimmed = text.trim();
    if (trimmed.length === 0) {
      sendBtn.setAttribute('aria-disabled', 'true');
      sendBtn.removeAttribute('href');
      return;
    }
    sendBtn.setAttribute('aria-disabled', 'false');
    const today = new Date().toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' });
    const subject = `Carpe Diem — ${today}`;
    const body = trimmed;
    sendBtn.href = `mailto:${RECIPIENT}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
  }

  ageEl.addEventListener('input', render);
  sexEl.addEventListener('change', render);
  todayEl.addEventListener('input', () => { autogrow(); updatePrompt(); });

  render();
  autogrow();
  updatePrompt();
</script>
</body>
</html>
