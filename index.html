<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CARPE DIEM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:         #f5efe2;   /* warm cream paper */
    --paper:      #ece3d0;   /* slightly deeper cream — section accent */
    --ink:        #2d2924;   /* warm near-black */
    --ink-soft:   #7a716b;   /* warm muted ink */
    --rule:       #d6cdba;   /* soft warm hairline */
    --lived:      #2d2924;   /* heavy warm ink for spent weeks */
    --remaining:  #eab308;   /* yellow — yet to come */
    --honey:      #c89752;   /* warm honey gold */
    --sage:       #7a9b94;   /* muted sage / teal */
    --gap: 10px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    font-weight: 400;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
  }
  body { height: 100dvh; }
  .page {
    height: 100dvh;
    max-width: 1180px;
    margin: 0 auto;
    padding: 14px 18px calc(env(safe-area-inset-bottom) + clamp(56px, 12vh, 120px)) 18px;
    display: flex;
    flex-direction: column;
    gap: var(--gap);
  }

  /* Title row — Carpe Diem left, hourglass to its right */
  .title-row {
    flex: 0 0 auto;
    display: flex;
    justify-content: flex-start;
    align-items: center;
    gap: 18px;
    padding: 2px 0 0;
  }
  h1 {
    font-family: 'Fraunces', 'Inter', serif;
    font-size: clamp(30px, 8.4vw, 52px);
    letter-spacing: 0.04em;
    margin: 0;
    font-weight: 500;
    line-height: 1;
    color: var(--ink);
    text-align: left;
    flex: 0 0 auto;
  }
  .hourglass {
    height: clamp(30px, 8vw, 50px);
    width: auto;
    flex: 0 0 auto;
    display: block;
  }

  /* Prompt card — soft paper, sits on its own row under the title */
  .prompt {
    flex: 0 0 auto;
    width: 100%;
    max-width: 460px;
    align-self: flex-start;
    background: var(--paper);
    border: 1px solid var(--rule);
    border-radius: 4px;
    padding: 10px 12px 8px;
  }
  .prompt-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 6px;
    gap: 10px;
  }
  .prompt-label {
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-weight: 600;
    color: var(--ink-soft);
  }
  .counter {
    font-size: 11px;
    letter-spacing: 0.04em;
    font-variant-numeric: tabular-nums;
    color: var(--ink-soft);
  }
  .counter.warn { color: var(--remaining); font-weight: 600; }
  .prompt-row {
    display: flex;
    align-items: stretch;
    gap: 8px;
  }
  .prompt textarea {
    flex: 1;
    border: none;
    outline: none;
    resize: none;
    font-family: inherit;
    font-size: 17px;
    line-height: 1.35;
    background: transparent;
    color: var(--ink);
    height: 26px;
    max-height: 86px;
    padding: 0;
    overflow-y: auto;
  }
  .prompt textarea::placeholder {
    color: var(--ink-soft);
    opacity: 0.6;
    font-style: italic;
  }
  .send-btn {
    font-family: inherit;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    font-weight: 600;
    padding: 0 16px;
    background: var(--ink);
    color: var(--bg);
    border: none;
    border-radius: 3px;
    cursor: pointer;
    text-decoration: none;
    flex: 0 0 auto;
    line-height: 1;
    display: inline-flex;
    align-items: center;
    transition: background-color 120ms ease, opacity 120ms ease;
  }
  .send-btn:hover { background: var(--remaining); }
  .send-btn[aria-disabled="true"] {
    background: var(--ink);
    color: var(--bg);
    opacity: 0.35;
    cursor: not-allowed;
    pointer-events: none;
  }

  /* Controls + readout — own row, below the hourglass */
  .meta {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    flex-wrap: wrap;
    min-width: 0;
  }
  .controls { display: flex; gap: 14px; align-items: center; }
  .field { display: flex; align-items: center; gap: 8px; }
  .field label {
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    font-weight: 500;
    color: var(--ink-soft);
  }
  .field input[type="number"],
  .field select {
    font-family: inherit;
    font-size: 16px;            /* >=16 prevents iOS focus zoom */
    padding: 6px 8px;
    border: 1px solid var(--rule);
    background: var(--bg);
    color: var(--ink);
    border-radius: 3px;
    outline: none;
  }
  .field input[type="number"]:focus,
  .field select:focus { border-color: var(--ink); }
  .field input[type="number"] { width: 62px; }
  .field select { width: 96px; }

  .age-col { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
  .attribution {
    font-size: 10px;
    letter-spacing: 0.04em;
    color: var(--ink-soft);
    white-space: nowrap;
  }
  .attribution a {
    color: var(--ink);
    text-decoration: none;
    border-bottom: 1px solid var(--rule);
  }
  .attribution a:hover { border-bottom-color: var(--remaining); color: var(--remaining); }

  .readout {
    font-size: 12px;
    color: var(--ink-soft);
    text-align: left;
    flex: 1 1 auto;
    min-width: 0;
  }
  .readout .num { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }

  /* Grid legend — white chips, left-aligned, just above the grid */
  .grid-legend {
    flex: 0 0 auto;
    display: flex;
    gap: 8px;
    justify-content: flex-start;
    padding: 2px 0 0;
  }
  .legend-chip {
    background: #fff;
    border: 1px solid var(--rule);
    padding: 4px 10px 4px 8px;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    font-weight: 600;
    color: var(--ink);
    border-radius: 2px;
    line-height: 1;
  }
  .legend-chip i {
    display: inline-block;
    width: 11px;
    height: 11px;
    border-radius: 1px;
    flex: 0 0 auto;
  }
  .swatch-lived { background: var(--lived); }
  .swatch-left { background: var(--remaining); }

  /* Stats strip — harmonious trio of muted accents */
  .stats {
    flex: 0 0 auto;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
    border-top: 1px solid var(--rule);
    border-bottom: 1px solid var(--rule);
    padding: 10px 0 8px;
  }
  .stat { text-align: center; min-width: 0; }
  .stat-num {
    font-family: 'Fraunces', 'Inter', serif;
    font-size: clamp(24px, 4.8vw, 36px);
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    line-height: 1.05;
    letter-spacing: 0.005em;
  }
  .stat-label {
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    font-weight: 600;
    color: var(--ink-soft);
    margin-top: 4px;
  }
  .stat-sub {
    font-size: 10px;
    letter-spacing: 0.02em;
    color: var(--ink-soft);
    opacity: 0.75;
    margin-top: 2px;
    font-style: italic;
  }
  #fartsNum  { color: #8b4513; }  /* brown */
  #sexNum    { color: #ec4899; }  /* pink  */
  #dreamsNum {
    background: linear-gradient(90deg,
      #ff2d55, #ff8c00, #ffcc00, #34c759, #00b8d4, #4361ee, #b10dc9, #ff2d55);
    background-size: 200% 100%;
    -webkit-background-clip: text;
            background-clip: text;
    -webkit-text-fill-color: transparent;
            color: transparent;
    animation: rainbow 6s linear infinite;
  }
  @keyframes rainbow {
    from { background-position: 0% 0; }
    to   { background-position: -200% 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    #dreamsNum { animation: none; }
  }

  /* Grid — fills remaining space in both dimensions */
  .grid-wrap {
    flex: 1 1 auto;
    min-height: 0;
    overflow: hidden;
    padding-top: 4px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(52, 1fr);
    width: 100%;
    height: 100%;
    gap: 1px;
  }
  .cell { background: var(--bg); min-width: 0; min-height: 0; }
  .cell.lived { background: var(--lived); }
  .cell.left  { background: var(--remaining); }

  /* Mobile — tighter spacing, vertical meta stack, bigger tap targets */
  @media (max-width: 640px) {
    :root { --gap: 8px; }
    .page {
      padding: 10px 12px calc(env(safe-area-inset-bottom) + 52px) 12px;
    }

    .title-row { gap: 12px; padding: 0; }
    h1 { font-size: clamp(26px, 9vw, 36px); }
    .hourglass { height: clamp(28px, 8.5vw, 38px); }

    .prompt { padding: 8px 10px 6px; max-width: 100%; }
    .prompt-label { font-size: 10px; }
    .counter { font-size: 10px; }
    .prompt textarea { font-size: 16px; height: 22px; }
    .send-btn { padding: 0 14px; font-size: 10px; }

    /* Stack readout above controls so each gets its own line */
    .meta {
      flex-direction: column;
      align-items: stretch;
      gap: 6px;
    }
    .readout { font-size: 12px; text-align: left; }
    .controls {
      justify-content: flex-start;
      gap: 12px;
      flex-wrap: wrap;
    }
    .field label { font-size: 10px; letter-spacing: 0.12em; }
    .field input[type="number"] { width: 64px; }
    .field select { width: 96px; }
    .attribution {
      font-size: 9px;
      letter-spacing: 0.03em;
      white-space: normal;
      line-height: 1.3;
      max-width: 220px;
    }

    .stats { gap: 8px; padding: 7px 0 6px; }
    .stat-num { font-size: clamp(20px, 6.4vw, 28px); }
    .stat-label { font-size: 9px; letter-spacing: 0.14em; margin-top: 2px; }
    .stat-sub { font-size: 9px; margin-top: 1px; }

    .grid-legend { gap: 6px; }
    .legend-chip { font-size: 10px; padding: 3px 8px; letter-spacing: 0.1em; }
    .legend-chip i { width: 10px; height: 10px; }
  }

  /* Tiny phones — push spacing even tighter */
  @media (max-width: 360px) {
    .controls { gap: 8px; }
    .attribution { max-width: 180px; }
    .stat-num { font-size: clamp(18px, 6vw, 22px); }
  }
</style>
</head>
<body>
<main class="page">

  <div class="title-row">
    <h1>Carpe Diem</h1>
    <svg class="hourglass" viewBox="0 0 40 60" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <rect x="0" y="0" width="40" height="3" fill="#2d2924"/>
      <rect x="0" y="57" width="40" height="3" fill="#2d2924"/>
      <path d="M 4 3 L 36 3 L 22 30 L 36 57 L 4 57 L 18 30 Z"
            fill="none" stroke="#2d2924" stroke-width="1.6" stroke-linejoin="miter"/>
      <!-- top: sand still to fall = REMAINING -->
      <path d="M 11 17 L 29 17 L 22 30 L 18 30 Z" fill="#eab308"/>
      <!-- bottom: sand already fallen = LIVED -->
      <path d="M 11 43 L 29 43 L 36 57 L 4 57 Z" fill="#2d2924"/>
    </svg>
  </div>

  <section class="prompt">
    <div class="prompt-header">
      <div class="prompt-label">What will you do today?</div>
      <div class="counter" id="counter">0 / 180</div>
    </div>
    <div class="prompt-row">
      <textarea id="today" rows="1" maxlength="180" placeholder="seize it…" spellcheck="false"></textarea>
      <a id="sendBtn" class="send-btn" aria-disabled="true" href="#">Send</a>
    </div>
  </section>

  <section class="meta">
    <div class="readout" id="readout"></div>
    <div class="controls">
      <div class="age-col">
        <div class="field">
          <label for="age">Age</label>
          <input id="age" type="number" min="0" max="119" step="1" value="30">
        </div>
        <div class="attribution">
          Life Expectancy calculated by <a href="https://www.health.state.ny.us/health_care/medicaid/publications/docs/adm/06adm-5att8.pdf" target="_blank" rel="noopener noreferrer">NY Health Dept</a>
        </div>
      </div>
      <div class="field">
        <label for="sex">Sex</label>
        <select id="sex">
          <option value="male">Male</option>
          <option value="female" selected>Female</option>
        </select>
      </div>
    </div>
  </section>

  <section class="stats">
    <div class="stat">
      <div class="stat-num" id="fartsNum">—</div>
      <div class="stat-label">Farts Left</div>
      <div class="stat-sub">10 / day</div>
    </div>
    <div class="stat">
      <div class="stat-num" id="sexNum">—</div>
      <div class="stat-label">Sex Left</div>
      <div class="stat-sub" id="sexSub">avg by age</div>
    </div>
    <div class="stat">
      <div class="stat-num" id="dreamsNum">—</div>
      <div class="stat-label">Dreams Left</div>
      <div class="stat-sub">5 / night</div>
    </div>
  </section>

  <div class="grid-legend">
    <span class="legend-chip"><i class="swatch-lived"></i>lived</span>
    <span class="legend-chip"><i class="swatch-left"></i>left</span>
  </div>

  <section class="grid-wrap" id="gridWrap">
    <div class="grid" id="grid" aria-label="Weeks of life"></div>
  </section>

</main>

<script>
  // NY State Medicaid 06 ADM-5 Attachment VIII — Life Expectancy Table
  const LE_MALE = [
    74.14,73.70,72.74,71.77,70.79,69.81,68.82,67.83,66.84,65.85,
    64.86,63.87,62.88,61.89,60.91,59.93,58.97,58.02,57.07,56.14,
    55.20,54.27,53.35,52.42,51.50,50.57,49.64,48.71,47.77,46.84,
    45.90,44.96,44.03,43.09,42.16,41.23,40.30,39.38,38.46,37.55,
    36.64,35.73,34.83,33.94,33.05,32.16,31.29,30.42,29.56,28.70,
    27.85,27.00,26.16,25.32,24.50,23.68,22.86,22.06,21.27,20.49,
    19.72,18.96,18.21,17.48,16.76,16.05,15.36,14.68,14.02,13.38,
    12.75,12.13,11.53,10.95,10.38, 9.83, 9.29, 8.77, 8.27, 7.78,
     7.31, 6.85, 6.42, 6.00, 5.61, 5.24, 4.89, 4.56, 4.25, 3.97,
     3.70, 3.45, 3.22, 3.01, 2.82, 2.64, 2.49, 2.35, 2.22, 2.11,
     2.00, 1.89, 1.79, 1.69, 1.59, 1.50, 1.41, 1.33, 1.25, 1.17,
     1.10, 1.03, 0.96, 0.89, 0.83, 0.77, 0.71, 0.66, 0.61, 0.56
  ];
  const LE_FEMALE = [
    79.45,78.94,77.97,77.00,76.01,75.03,74.04,73.05,72.06,71.07,
    70.08,69.09,68.09,67.10,66.11,65.13,64.15,63.17,62.20,61.22,
    60.25,59.28,58.30,57.33,56.36,55.39,54.41,53.44,52.47,51.50,
    50.53,49.56,48.60,47.63,46.67,45.71,44.76,43.80,42.86,41.91,
    40.97,40.03,39.09,38.16,37.23,36.31,35.39,34.47,33.56,32.65,
    31.75,30.85,29.95,29.07,28.18,27.31,26.44,25.58,24.73,23.89,
    23.06,22.24,21.43,20.63,19.84,19.06,18.30,17.54,16.80,16.07,
    15.35,14.65,13.96,13.28,12.62,11.97,11.33,10.71,10.11, 9.52,
     8.95, 8.40, 7.87, 7.36, 6.88, 6.42, 5.98, 5.56, 5.17, 4.81,
     4.47, 4.15, 3.86, 3.59, 3.35, 3.13, 2.93, 2.75, 2.58, 2.43,
     2.29, 2.15, 2.02, 1.89, 1.77, 1.66, 1.55, 1.44, 1.34, 1.25,
     1.16, 1.07, 0.99, 0.91, 0.84, 0.77, 0.71, 0.66, 0.61, 0.56
  ];

  const COLS = 52;

  const ageEl = document.getElementById('age');
  const sexEl = document.getElementById('sex');
  const gridEl = document.getElementById('grid');
  const readoutEl = document.getElementById('readout');
  const todayEl = document.getElementById('today');
  const counterEl = document.getElementById('counter');
  const sendBtn = document.getElementById('sendBtn');
  const fartsNumEl = document.getElementById('fartsNum');
  const dreamsNumEl = document.getElementById('dreamsNum');
  const sexNumEl = document.getElementById('sexNum');
  const sexSubEl = document.getElementById('sexSub');
  const MAX_CHARS = 180;
  const RECIPIENT = 'reubstock@gmail.com';

  function sexFreqPerYear(a) {
    if (a < 18) return 0;
    if (a < 30) return 2.5 * 52;
    if (a < 50) return 1.5 * 52;
    return 3 * 12;
  }
  function sexLeft(currentAge, remainingYears) {
    let total = 0;
    let a = currentAge;
    const end = currentAge + remainingYears;
    while (a < end) {
      const chunk = Math.min(1, end - a);
      total += sexFreqPerYear(Math.floor(a)) * chunk;
      a += chunk;
    }
    return Math.round(total);
  }

  function clampAge(v) {
    v = Math.floor(Number(v));
    if (!Number.isFinite(v)) return 0;
    return Math.max(0, Math.min(119, v));
  }

  function render() {
    const age = clampAge(ageEl.value);
    const table = sexEl.value === 'male' ? LE_MALE : LE_FEMALE;
    const remainingYears = table[age];
    const totalYears = age + remainingYears;
    const totalRows = Math.ceil(totalYears);
    const totalWeeks = totalRows * COLS;
    const weeksLived = Math.round(age * COLS);
    const weeksLeft = Math.max(0, Math.round(totalYears * COLS) - weeksLived);

    readoutEl.innerHTML =
      `<span class="num">${weeksLeft.toLocaleString()}</span> weeks ` +
      `(<span class="num">${remainingYears.toFixed(1)}</span> yrs) to go`;

    const daysLeft = remainingYears * 365.25;
    fartsNumEl.textContent = Math.round(daysLeft * 10).toLocaleString();
    dreamsNumEl.textContent = Math.round(daysLeft * 5).toLocaleString();
    sexNumEl.textContent = sexLeft(age, remainingYears).toLocaleString();
    sexSubEl.textContent =
      age < 18 ? 'starts at 18' :
      age < 30 ? '~2.5 / week' :
      age < 50 ? '~1.5 / week' :
                 '~3 / month';

    const filledWeeks = weeksLived + weeksLeft;
    const cells = new Array(totalWeeks);
    for (let i = 0; i < totalWeeks; i++) {
      let cls = 'cell';
      if (i < weeksLived) cls += ' lived';
      else if (i < filledWeeks) cls += ' left';
      cells[i] = `<div class="${cls}"></div>`;
    }
    gridEl.style.gridTemplateRows = `repeat(${totalRows}, 1fr)`;
    gridEl.innerHTML = cells.join('');
  }

  function updatePrompt() {
    const text = todayEl.value.slice(0, MAX_CHARS);
    if (text.length !== todayEl.value.length) todayEl.value = text;
    const len = text.length;
    counterEl.textContent = `${len} / ${MAX_CHARS}`;
    counterEl.classList.toggle('warn', len >= MAX_CHARS - 20);

    const trimmed = text.trim();
    if (trimmed.length === 0) {
      sendBtn.setAttribute('aria-disabled', 'true');
      sendBtn.removeAttribute('href');
      return;
    }
    sendBtn.setAttribute('aria-disabled', 'false');
    const today = new Date().toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' });
    sendBtn.href = `mailto:${RECIPIENT}?subject=${encodeURIComponent('Carpe Diem — ' + today)}&body=${encodeURIComponent(trimmed)}`;
  }

  ageEl.addEventListener('input', render);
  sexEl.addEventListener('change', render);
  todayEl.addEventListener('input', updatePrompt);

  render();
  updatePrompt();
</script>
</body>
</html>
